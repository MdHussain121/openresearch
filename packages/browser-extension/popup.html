<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save to OpenResearch</title>
  <style>
    :root {
      --bg-surface: #FFFFFF;
      --bg-sunken: #F1F0EE;
      --text-primary: #1A1A18;
      --text-secondary: #5C5B57;
      --accent: #2C5F4A;
      --border: #E4E2DE;
      --success: #3A7D5C;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      background: var(--bg-surface);
      color: var(--text-primary);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: var(--bg-sunken);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background: var(--bg-sunken);
      color: var(--text-primary);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(58, 125, 92, 0.1);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status.error {
      display: block;
      background: rgba(179, 58, 58, 0.1);
      color: #b33a3a;
      border: 1px solid #b33a3a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>✦ OpenResearch</span>
    </div>
    <span class="badge">Extension</span>
  </div>

  <div class="field">
    <label for="paperTitle">Paper / Page Title</label>
    <input type="text" id="paperTitle" placeholder="Detecting..." />
  </div>

  <div class="field">
    <label for="identifier">Detected Identifier (DOI / arXiv / URL)</label>
    <input type="text" id="identifier" placeholder="e.g. 10.48550/arXiv.1706.03762" />
  </div>

  <div class="field">
    <label for="apiUrl">OpenResearch API Endpoint</label>
    <input type="text" id="apiUrl" value="http://localhost:8000/api/v1" />
  </div>

  <div class="field">
    <label for="projectSelect">Project</label>
    <select id="projectSelect">
      <option value="">Loading projects...</option>
    </select>
  </div>

  <button id="saveBtn">Save to OpenResearch Library</button>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
