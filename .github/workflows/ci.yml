name: OpenResearch CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  frontend-check:
    name: Frontend Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo packages
        run: npm run typecheck

      - name: Lint frontend packages
        run: npm run lint

      - name: Run package unit tests (vitest)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js application
        run: npm run build

  backend-check:
    name: Backend Lint, Pytest Suite & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.lock'

      - name: Install Python dependencies (pinned lockfile)
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Ruff Lint Check
        run: |
          cd apps/api
          ruff check .

      - name: Run Mypy Type Check
        run: |
          cd apps/api
          mypy app

      - name: Run Pytest Test Suite
        run: |
          cd apps/api
          pytest

      - name: Audit Python dependencies
        run: |
          cd apps/api
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off

  docker-build-check:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.api
          push: false
          tags: openresearch-api:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.web
          push: false
          tags: openresearch-web:ci-test
