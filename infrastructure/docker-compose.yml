services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openresearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openresearch_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-openresearch}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openresearch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openresearch-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: openresearch-grobid
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    environment:
      JAVA_OPTS: "-Xmx4g"

volumes:
  postgres_data:
  redis_data:
