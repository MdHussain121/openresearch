[project]
name = "openresearch-api"
version = "0.1.0"
description = "FastAPI backend for OpenResearch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.2.0",
    "reportlab>=4.5.0",
    "pypdf>=5.0.0",
    "defusedxml>=0.7.1",
    "starlette>=0.37.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
]
all = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "FAST", "T10", "T20", "DTZ", "ERA", "RUF", "ASYNC"]
ignore = ["E501", "E741", "B008", "FAST002", "FAST001", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ANN", "D1", "PLR2004", "SLF001", "ARG005", "PT013", "RUF059", "ERA001"]
"alembic/**" = ["D100", "D101", "D103", "D400", "D415", "Q000", "UP007", "I001", "INP001", "CPY001", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^alembic/", "^\\.venv/"]

[tool.coverage.run]
source = ["app"]

[tool.pytest.ini_options]
# Ratchet policy: keep the floor at or below measured coverage, then raise it
# as gaps close. Calibrated 2026-08-26 to measured total of 93.57%.
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=93"
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
    "integration: endpoint/service integration tests",
    "network: tests that require internet reachability (must be explicitly opted in)",
    "e2e: full user-journey tests",
]
